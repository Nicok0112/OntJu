services:
  backend:
    build:
      context: ./backend
    container_name: lexengine-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend/data:/app/data
      - ./backend/cartuchos:/app/cartuchos
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: lexengine-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
